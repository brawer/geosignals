#
# Config for `cargo deny` (https://github.com/EmbarkStudios/cargo-deny):
# checks the dependency graph for known vulnerabilities, disallowed
# licenses, banned/duplicated crates, and untrusted sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true

# ── advisories: RUSTSEC/OSV vulnerabilities, unmaintained/yanked crates ─────
[advisories]
yanked = "deny"
# Spelled out so local runs match CI, whatever cargo-deny version.
unmaintained = "all"
ignore = [
  # chrono is unmaintained (no vulnerability). We don't use it directly;
  # parquet requires it unconditionally, even in 60.2.0 (the newest
  # release as of 2026-11-23), only to format DATE/TIMESTAMP values in
  # its record API, which geosignals never calls. Upstream tracks the
  # move to jiff in apache/arrow-rs#9183 and #12343. Drop this entry
  # once a parquet release no longer depends on chrono.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono, required by parquet; no fixed release yet" },
]

# ── licenses: only accept licenses we've reviewed as OK to redistribute ─────
[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # Public-domain dedication, e.g. tiny-keccak.
  "CC0-1.0",
  # webpki-roots: Mozilla's CA list, under a permissive data license.
  "CDLA-Permissive-2.0",
  # ring, rustls-webpki, untrusted.
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# ── bans: banned crates, duplicate-version bloat, wildcard versions ─────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

# ── sources: only allow crates.io, not arbitrary git/registries ─────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
