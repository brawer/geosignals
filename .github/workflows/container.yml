name: Container

# Builds the container image with podman, runs it on the test extract, and
# generates its SBOM, like release-build.yml does for a release (minus
# publishing). Only on amd64: arm64 rarely breaks on its own, so it is only
# built at release time. Only runs when the container setup changes; Rust
# changes are covered by test.yml, and building the image on every PR
# would be wasteful.
on:
  push:
    branches: [ "main" ]
    paths:
      - "Containerfile"
      - ".containerignore"
      - "scripts/install-syft.sh"
      - "scripts/sbom.sh"
      - ".github/workflows/container.yml"
      - ".github/workflows/release-build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Containerfile"
      - ".containerignore"
      - "scripts/install-syft.sh"
      - "scripts/sbom.sh"
      - ".github/workflows/container.yml"
      - ".github/workflows/release-build.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install podman and jq
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q podman jq
    - name: Build image
      run: podman build --tag osmsignals .
    - name: Run on test extract
      run: |
        mkdir -p "$RUNNER_TEMP/data"
        cp tests/data/zugerland.osm.pbf "$RUNNER_TEMP/data/"
        podman run --rm --network=none \
          --userns=keep-id --user "$(id -u):$(id -g)" \
          --volume "$RUNNER_TEMP/data:/data" \
          osmsignals osm-node-density \
          --input zugerland.osm.pbf --output-dir .
        test -s "$RUNNER_TEMP/data/osm-node-density.2026-01-27.tiff"
        # Reads the first blocks of the latest planet over HTTPS,
        # which checks that TLS works in the otherwise empty image.
        podman run --rm \
          --userns=keep-id --user "$(id -u):$(id -g)" \
          --volume "$RUNNER_TEMP/data:/data" \
          osmsignals osm-node-density --smoke-test --output-dir planet
        ls -l "$RUNNER_TEMP"/data/planet/osm-node-density.*.tiff
    - name: Generate SBOM
      run: |
        scripts/install-syft.sh "$RUNNER_TEMP/bin"
        podman save --format oci-archive --output "$RUNNER_TEMP/image.tar" osmsignals
        PATH="$RUNNER_TEMP/bin:$PATH" scripts/sbom.sh "$RUNNER_TEMP/image.tar" \
          ghcr.io/${{ github.repository }} "$(podman inspect --format '{{.Digest}}' osmsignals)" \
          sbom.cdx.json
        jq '{specVersion, components: (.components | length)}' sbom.cdx.json
    - name: Upload SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: sbom
        path: sbom.cdx.json
        retention-days: 7
    - name: Show image size
      run: podman image ls osmsignals
