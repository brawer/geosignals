name: cargo-deny

# Checks the dependency graph against deny.toml: known RUSTSEC/OSV
# vulnerabilities, disallowed licenses, banned/duplicated crates, and
# untrusted (non-crates.io) sources.
on:
  merge_group:
  push:
    branches: [ "main" ]
    paths: [ "Cargo.lock", "Cargo.toml", "deny.toml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "Cargo.lock", "Cargo.toml", "deny.toml" ]
  schedule:
    # New advisories get published against dependencies we already pinned,
    # with no change here to trigger the path filters above.
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Check licenses, advisories, bans, and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: cargo deny check ${{ matrix.checks }}
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
      with:
        command: check
        command-arguments: ${{ matrix.checks }}
