name: Smoke test

# Runs the pipeline on a real country extract from Geofabrik, and
# republishes Nominatim's raster. Kept out of PR checks because it
# depends on external downloads; it runs for
# release tags, and can be started by hand from the Actions tab.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Smoke test on Liechtenstein
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Download Liechtenstein from Geofabrik
      run: |
        curl --fail --silent --show-error --location --retry 3 \
          --output liechtenstein.osm.pbf \
          https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
        ls -l liechtenstein.osm.pbf
    - name: Run smoke test
      env:
        GEOSIGNALS_SMOKE_PBF: liechtenstein.osm.pbf
      run: cargo test --locked --release --test osm_node_density smoke_test -- --nocapture
    - name: Read the latest planet over HTTPS
      run: |
        cargo run --locked --release -- osm-node-density --smoke-test --output-dir out
        ls -l out/osm-node-density.*.tiff
        cat out/osm-node-density.*.cdx.json
    - name: Check output with GDAL
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q gdal-bin python3-gdal
        gdalinfo out/osm-node-density.*.tiff
        /usr/bin/python3 -W ignore -m osgeo_utils.samples.validate_cloud_optimized_geotiff \
          --full-check=yes out/osm-node-density.*.tiff
    - name: Republish Nominatim's secondary importance
      run: |
        cargo run --locked --release -- nominatim-secondary-importance --output-dir nominatim
        ls -l nominatim/nominatim-secondary-importance.*.tiff
        cat nominatim/nominatim-secondary-importance.*.cdx.json
    - name: Check Nominatim output with GDAL
      run: |
        gdalinfo nominatim/nominatim-secondary-importance.*.tiff | grep -v '<Row'
        /usr/bin/python3 -W ignore -m osgeo_utils.samples.validate_cloud_optimized_geotiff \
          --full-check=yes nominatim/nominatim-secondary-importance.*.tiff
    - name: Check data packages with Frictionless
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet frictionless==5.21.0 'pystac[validation]==1.15.2'
        (cd out && "$RUNNER_TEMP/venv/bin/frictionless" validate datapackage.json)
        (cd nominatim && "$RUNNER_TEMP/venv/bin/frictionless" validate datapackage.json)
    - name: Check STAC catalogs with pystac
      run: |
        for collection in out/collection.json nominatim/collection.json; do
          "$RUNNER_TEMP/venv/bin/python" -c '
        import os, sys, pystac, pystac.validation
        href = os.path.abspath(sys.argv[1])
        pystac.validation.validate_all(pystac.StacIO.default().read_json(href), href)
        items = [i.id for i in pystac.read_file(href).get_items()]
        print(href, "is valid STAC, with items", items)
        ' "$collection"
        done
