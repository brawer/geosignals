name: Smoke test

# Runs the pipeline on a real country extract from Geofabrik. Kept out of
# PR checks because it depends on an external download; it runs for
# release tags, and can be started by hand from the Actions tab.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Smoke test on Liechtenstein
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Download Liechtenstein from Geofabrik
      run: |
        curl --fail --silent --show-error --location --retry 3 \
          --output liechtenstein.osm.pbf \
          https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
        ls -l liechtenstein.osm.pbf
    - name: Run smoke test
      env:
        OSMSIGNALS_SMOKE_PBF: liechtenstein.osm.pbf
      run: cargo test --locked --release --test node_density smoke_test -- --nocapture
    - name: Run command-line tool
      run: |
        cargo run --locked --release -- node-density \
          --input liechtenstein.osm.pbf --output liechtenstein.tif
        ls -l liechtenstein.tif
    - name: Check output with GDAL
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q gdal-bin python3-gdal
        gdalinfo liechtenstein.tif
        /usr/bin/python3 -W ignore -m osgeo_utils.samples.validate_cloud_optimized_geotiff \
          --full-check=yes liechtenstein.tif
