name: Tests

on:
  merge_group:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Check formatting
      run: cargo fmt --check
    - name: Look for common mistakes
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --locked --release

  smoke:
    name: Smoke test on Liechtenstein
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Download Liechtenstein from Geofabrik
      run: |
        curl --fail --silent --show-error --location --retry 3 \
          --output liechtenstein.osm.pbf \
          https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
        ls -l liechtenstein.osm.pbf
    - name: Run smoke test
      env:
        OSMSIGNALS_SMOKE_PBF: liechtenstein.osm.pbf
      run: cargo test --locked --release --test node_density smoke_test -- --nocapture
    - name: Run command-line tool
      run: |
        cargo run --locked --release -- node-density \
          --input liechtenstein.osm.pbf --output liechtenstein.pmtiles
        ls -l liechtenstein.pmtiles
    - name: Check output with the reference PMTiles tool
      run: |
        curl --fail --silent --show-error --location --output go-pmtiles.tar.gz \
          https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
        tar xzf go-pmtiles.tar.gz pmtiles
        ./pmtiles show liechtenstein.pmtiles
        ./pmtiles verify liechtenstein.pmtiles
