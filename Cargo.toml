[package]
name = "osmsignals"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Ranking signals for OpenStreetMap"
repository = "https://github.com/brawer/osmsignals"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
fast_hilbert = "2.1.0"
osmpbf = "0.3.8"
tempfile = "3.27.0"
zstd = "0.14.3"

[dev-dependencies]
approx = "0.5.1"
tempfile = "3.27.0"
