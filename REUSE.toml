version = 1

# The root LICENSE file duplicates LICENSES/MIT.txt so that GitHub, whose
# license detection is unreliable at finding LICENSES/, still recognises it.
# Cargo.lock is generated and cannot carry a header comment.
[[annotations]]
path = ["LICENSE", "Cargo.lock"]
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# OpenStreetMap extracts used as test data.
[[annotations]]
path = "tests/data/*.osm.pbf"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"
